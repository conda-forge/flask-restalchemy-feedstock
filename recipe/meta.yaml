{% set name = "flask-restalchemy" %}
{% set version = "0.15.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 11bb8f37599c23467c5720e26af42cd7c69c86890a7d7eb3c7f4b2c11a2965dd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - flask-sqlalchemy >=3.0
    - sqlalchemy-utils >=0.30
    - flask >=1.0.0
    - sqlalchemy >=1.4,<3
    - serialchemy >=0.3.0

test:
  imports:
    - flask_restalchemy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ESSS/flask-restalchemy
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Flask extension to build REST APIs based on SQLAlchemy models
  description: |
    A Flask extension to build REST APIs. It dismiss the need of building Schema classes, 
    since usually all the information needed to serialize an SQLAlchemy instance is in the model itself.

extra:
  recipe-maintainers:
    - igortg
    - lvoliveira
    - edetec
